<svg width="100%" viewBox="0 0 680 632" role="img" xmlns="http://www.w3.org/2000/svg">
<title>System overview of the AI test agent</title>
<desc>Callers (a person, a coding agent, a CI job) use thin interfaces to a run controller with an event log. An agent loop drives an isolated headless browser using page structure first and a vision fallback, calls a model provider, and the verdict engine computes the result from assertions. Safety rails surround the core. Below, the service mode (designed, built on demand): balancer, stateless API, queue, autoscaled workers, database and storage.</desc>

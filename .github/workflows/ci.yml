name: CI

on:
  push:
    branches: [main, v1.1]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../evals --config ruff.toml
      - run: pytest -q
      - run: pip install pillow==12.3.0   # the review-page tests build real images
      - run: pytest -q ../evals/pointing

  client:
    name: Client (syntax check + history tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The GUI needs a desktop session, so CI only proves the client files parse and tests its pure logic.
      - run: python -m compileall -q client
      - run: pip install pytest==9.1.1
      - run: pytest -q client/tests
